name: SAMM CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PIP_DOWNLOAD_CACHE: .pip_download_cache
  BOTO_CONFIG: /doesnotexist
  PY_COLORS: 1
  FORCE_COLOR: 1

# ─────────────────────────────────────────────────────────────
# SAMM Governance: Ensure minimum 2 approvals before merge
# (configured in branch protection rules separately)
# ─────────────────────────────────────────────────────────────

jobs:

  # ============================================================
  # SAMM Verification: Security Testing — SAST
  # Covers: CodeQL (GitHub's SAST), Semgrep (OWASP rules),
  #         Bandit (Python-specific)
  # ============================================================
  sast:
    name: "SAST — Static Analysis"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild (CodeQL)
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================
  # SAMM Verification: Security Testing — Semgrep (deep SAST)
  # ============================================================
  semgrep:
    name: "SAST — Semgrep Deep Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Semgrep
        run: pip install semgrep
      - name: Run Semgrep (OWASP Top 10 + Python rules)
        run: |
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/python" \
            --config "p/flask" \
            --config "p/sql-injection" \
            --config "p/secrets" \
            --sarif --output semgrep.sarif \
            --jobs 2 || true
      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # SAMM Threat Prevention: Secret Scanning
  # ============================================================
  secrets-scan:
    name: "Secrets — Gitleaks Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true

  # ============================================================
  # SAMM Implementation: Secure Build — SCA (Software Composition Analysis)
  # ============================================================
  sca:
    name: "SCA — Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies for known CVEs
        run: |
          pip-audit \
            --requirement requirements.txt \
            --requirement requirements-tests.txt \
            --requirement requirements-dev.txt \
            --strict \
            --progress-spinner off \
            2>&1 | tee pip-audit-results.txt
        continue-on-error: true
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.txt

  # ============================================================
  # SAMM Implementation: Secure Build — Build & Test
  # Based on existing ci.yml matrix: Python 3.10/3.11, PG 16/17
  # ============================================================
  build-and-test:
    name: "Build & Test (Py${{ matrix.python-version }} / PG${{ matrix.postgres-version }})"
    needs: [sast, semgrep, secrets-scan, sca]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
        postgres-version: [16, 17]
        os: [ubuntu-22.04]
        include:
          - python-version: "3.10"
            toxenv: py310
          - python-version: "3.11"
            toxenv: py311

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: lemur
          POSTGRES_PASSWORD: lemur
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    env:
      TOXENV: ${{ matrix.toxenv }}
      SETUPTOOLS_USE_DISTUTILS: stdlib
      SQLALCHEMY_DATABASE_URI: postgresql://lemur:lemur@localhost:5432/lemur

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsasl2-dev libldap2-dev xvfb make

      - name: Python Bandit scan
        run: |
          pip install bandit
          bandit -r lemur/ -ll -ii -x lemur/tests/ -f json -o bandit-results.json || true
          bandit -r lemur/ -ll -ii -x lemur/tests/ -f screen
      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results-py${{ matrix.python-version }}-pg${{ matrix.postgres-version }}
          path: bandit-results.json

      - name: Python lint (flake8 + mypy)
        run: |
          pip install flake8 mypy
          PYFLAKES_NODOCTEST=1 flake8 lemur --max-line-length=100
        continue-on-error: true

      - name: Install and test
        run: |
          python -m venv ~/env
          source ~/env/bin/activate
          python -m pip install --upgrade pip setuptools
          pip install -e .
          pip install "file://`pwd`#egg=lemur[tests]"
          coverage run --source lemur -m pytest --tb=short 2>&1
          coverage xml -o coverage.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}-pg${{ matrix.postgres-version }}
          path: coverage.xml

      - name: Coveralls
        if: matrix.python-version == '3.11' && matrix.postgres-version == 17 && matrix.os == 'ubuntu-22.04'
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: Py${{ matrix.python-version }} PG${{ matrix.postgres-version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  coveralls-finish:
    name: "Coveralls — Finalize"
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true

  # ============================================================
  # SAMM Implementation: Secure Build — Docker Image Build
  # ============================================================
  docker-build:
    name: "Docker — Build Image"
    needs: [build-and-test]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # SAMM Verification: Security Testing — Container Scan
  # ============================================================
  container-scan:
    name: "Container — Trivy Vulnerability Scan"
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull built image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif

  # ============================================================
  # SAMM Implementation: Secure Deployment — SBOM Generation
  # ============================================================
  sbom:
    name: "SBOM — Software Bill of Materials"
    needs: [docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

  # ============================================================
  # SAMM Verification: Security Testing — DAST (Dynamic)
  # Requires a running instance; runs on main branch only
  # ============================================================
  dast:
    name: "DAST — OWASP ZAP Baseline Scan"
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start application
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 30
          docker compose ps

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_*

      - name: Stop application
        if: always()
        run: docker compose down

  # ============================================================
  # SAMM Governance: Pipeline Gate — All checks must pass
  # ============================================================
  pipeline-gate:
    name: "SAMM Pipeline Gate — All Checks Passed"
    needs:
      - sast
      - semgrep
      - secrets-scan
      - sca
      - build-and-test
      - docker-build
      - container-scan
      - sbom
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all job results
        run: |
          FAIL=0

          check() {
            local name="$1"
            local result="$2"
            echo "$name: $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "FAIL: $name returned $result"
              FAIL=1
            fi
          }

          check "SAST"              "${{ needs.sast.result }}"
          check "Semgrep"           "${{ needs.semgrep.result }}"
          check "Secrets"           "${{ needs.secrets-scan.result }}"
          check "SCA"               "${{ needs.sca.result }}"
          check "Build & Test"      "${{ needs.build-and-test.result }}"
          check "Docker Build"      "${{ needs.docker-build.result }}"
          check "Container Scan"    "${{ needs.container-scan.result }}"
          check "SBOM"              "${{ needs.sbom.result }}"

          if [[ "$FAIL" == "1" ]]; then
            echo ""
            echo "PIPELINE FAILED — one or more gates did not pass"
            exit 1
          fi
          echo ""
          echo "ALL GATES PASSED"
